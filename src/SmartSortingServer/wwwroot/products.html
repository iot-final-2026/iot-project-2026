<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제품 이미지</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
  <body>
  <div class="app">
    <header class="header">
      <h1>자동 분류 및 작업자 포장 알림 시스템</h1>

      <div class="admin-dropdown">
        <button type="button" id="adminMenuButton" class="admin-menu">
          <svg class="admin-avatar" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="currentColor"/><circle cx="14" cy="10" r="4" fill="#fff"/><path d="M6 23a8 8 0 0 1 16 0Z" fill="#fff"/></svg>
          <span id="adminName">관리자</span>
          <i data-lucide="chevron-down" class="admin-chevron" aria-hidden="true"></i>
        </button>

        <div id="adminDropdownMenu" class="admin-dropdown-menu">
          <button type="button" id="logoutMenuButton" class="admin-dropdown-item">
            <i data-lucide="log-out"></i>
            <span>로그아웃</span>
          </button>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="house"></i>
          <span>대시보드</span>
        </a>
        <a href="products.html" class="nav-item active">
          <i data-lucide="image"></i>
          <span>제품 이미지</span>
        </a>
        <a href="alerts.html" class="nav-item">
          <i data-lucide="triangle-alert"></i>
          <span>알람/이상 내역</span>
        </a>
      </nav>
    </aside>
    <main class="main-content products-page">
      <section class="page-toolbar panel">
        <div class="page-title-group">
          <h2>제품 이미지</h2>
        </div>

        <div class="toolbar-controls">
          <div class="filter-group">
            <div class="segmented-control">
              <button type="button" class="segment active">전체</button>
              <button type="button" class="segment">초콜릿</button>
              <button type="button" class="segment">사탕</button>
              <button type="button" class="segment">실패</button>
            </div>
          </div>

          <div class="filter-group search-group">
            <div class="input-with-icon">
              <i data-lucide="search"></i>
              <input id="productSearch" type="search" inputmode="numeric" pattern="[0-9]*" placeholder="감지 ID 검색" aria-label="감지 ID 검색">
            </div>
          </div>
        </div>
      </section>

      <section class="products-layout">
        <article class="panel product-gallery-panel">
          <div class="panel-header">
            <h2>최근 감지 목록</h2>
            <span id="productResultCount" class="result-count">0건</span>
          </div>

          <div id="productGallery" class="product-gallery-grid" aria-live="polite"></div>
          <div id="productEmptyState" class="product-empty-state" hidden>조회된 감지 결과가 없습니다.</div>
          <div class="product-pagination" aria-label="제품 감지 페이지 이동">
            <button id="productPrevPage" type="button" class="pagination-button">이전</button>
            <span id="productPageInfo">1 / 1</span>
            <button id="productNextPage" type="button" class="pagination-button">다음</button>
          </div>
        </article>

        <aside class="panel detection-detail-panel">
          <div class="panel-header">
            <h2>감지 상세</h2>
            <span id="detailStatus" class="status-pill info">-</span>
          </div>

          <div class="detail-image">
            <div id="detailImagePlaceholder" class="image-placeholder">이미지 준비 중</div>
          </div>

          <dl class="detail-list">
            <div>
              <dt>감지 ID</dt>
              <dd id="detailDetectionId">-</dd>
            </div>
            <div>
              <dt>분류 상태</dt>
              <dd id="detailClassificationStatus">-</dd>
            </div>
            <div>
              <dt>제품 코드</dt>
              <dd id="detailProductType">-</dd>
            </div>
            <div>
              <dt>신뢰도</dt>
              <dd id="detailConfidence">-</dd>
            </div>
            <div>
              <dt>감지 시간</dt>
              <dd id="detailDetectedAt">-</dd>
            </div>
            <div>
              <dt>생산 세션</dt>
              <dd id="detailSessionId">-</dd>
            </div>
          </dl>
        </aside>
      </section>
    </main>
  </div>

  <!-- 로그아웃 모달도 index와 동일하게 -->
   <div id="logoutModal" class="modal-overlay" hidden>
    <div class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logoutModalTitle">
      <h2 id="logoutModalTitle">로그아웃하시겠습니까?</h2>
      <p>현재 관리자 세션을 종료하고<br> 로그인 화면으로 이동합니다.</p>

      <div class="logout-modal-actions">
        <button type="button" id="cancelLogoutButton" class="modal-button secondary">
          취소
        </button>
        <button type="button" id="confirmLogoutButton" class="modal-button danger">
          로그아웃
        </button>
      </div>
    </div>
  </div>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/api-client.js"></script>
<script src="js/products.js"></script>
<script src="js/auth-ui.js"></script>
<script>
  if (!localStorage.getItem('accessToken')) {
    window.location.href = 'login.html';
  }
  lucide.createIcons();
</script>
</html>
